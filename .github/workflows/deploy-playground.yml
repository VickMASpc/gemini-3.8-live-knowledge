name: Build Gemini Live Playground for Pages
on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: publish-playground
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: playground
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: playground
        run: npm run build
      - name: Publish built files to docs
        run: |
          mkdir -p docs
          find docs -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a playground/dist/. docs/
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --staged --quiet; then
            git commit -m "Publish Gemini Live Playground built assets"
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist
      - name: Deploy directly to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
